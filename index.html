<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Propulsion System Architecture Studio — modular aerospace propulsion design, live analysis, and mission suitability evaluation." />
  <title>Propulsion System Architecture Studio</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
</head>
<body>
  <div id="app">
    <p style="font-family:system-ui;color:#8b9cb8;padding:2rem;text-align:center">Loading Propulsion Studio…</p>
  </div>
  <script type="module" src="js/app.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<pre style="color:#ef476f;padding:2rem;font-family:monospace;white-space:pre-wrap">Failed to load: ' + (e.message || e) + '</pre>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<pre style="color:#ef476f;padding:2rem;font-family:monospace;white-space:pre-wrap">Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</pre>';
    });
  </script>
</body>
</html>
